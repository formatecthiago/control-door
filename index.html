<script>
    const config = { apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM", databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com" };

    let streamCameraAtiva = null;

    function executarBoasVindasVoz() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const texto = "Seja bem vindo. Clique em aceitar e iniciar para continuar.";
            const ut = new SpeechSynthesisUtterance(texto);
            ut.lang = 'pt-BR';
            ut.rate = 0.95;
            ut.pitch = 0.85;

            const falar = () => {
                const voces = window.speechSynthesis.getVoices();
                const vozPt = voces.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
                if (vozPt) ut.voice = vozPt;
                window.speechSynthesis.speak(ut);
            };

            if (window.speechSynthesis.getVoices().length > 0) {
                falar();
            } else {
                window.speechSynthesis.onvoiceschanged = falar;
            }
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        executarBoasVindasVoz();
        const desbloquearAudioTouch = () => {
            executarBoasVindasVoz();
            document.removeEventListener('touchstart', desbloquearAudioTouch);
            document.removeEventListener('click', desbloquearAudioTouch);
        };
        document.addEventListener('touchstart', desbloquearAudioTouch, { once: true });
        document.addEventListener('click', desbloquearAudioTouch, { once: true });
    });

    function gerarFingerprintDispositivo() {
        const comp = [screen.width, screen.height, navigator.hardwareConcurrency || 4, navigator.language];
        let hash = 0;
        const str = comp.join('||');
        for (let i = 0; i < str.length; i++) { hash = (hash << 5) - hash + str.charCodeAt(i); hash |= 0; }
        return "V-" + Math.abs(hash).toString(16).toUpperCase();
    }
    const meu_fingerprint = gerarFingerprintDispositivo();

    function virtyAlert(msg) {
        document.getElementById('custom-alert-msg').innerText = msg;
        document.getElementById('custom-alert').style.display = 'block';
    }
    function fecharAlertCustomizado() { document.getElementById('custom-alert').style.display = 'none'; }

    function mudarTela(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const alvo = document.getElementById(id);
        if (alvo) alvo.classList.add('active');

        if (id !== 's-camera') encerrarStreamCamera();
        if (id === 's-boasvindas') executarBoasVindasVoz();
    }

    function avancarParaCamera() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        mudarTela('s-camera');
        // Delay minúsculo para garantir a montagem completa da div da câmera no DOM
        setTimeout(() => { inicializarCapturaVideo(); }, 100);
    }

    function encerrarStreamCamera() {
        if (loopValidacaoFacial) { clearInterval(loopValidacaoFacial); loopValidacaoFacial = null; }
        if (streamCameraAtiva) {
            try { streamCameraAtiva.getTracks().forEach(track => track.stop()); } catch(e){}
            streamCameraAtiva = null;
        }
    }

    async function inicializarCapturaVideo() {
        encerrarStreamCamera();
        const video = document.getElementById('v-vis');
        const canvas = document.getElementById('c-vis');
        if (!video) return;

        video.style.display = "block";
        if(canvas) canvas.style.display = "none";

        try {
            const mode = usarLenteFrontal ? "user" : "environment";
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: mode, width: { ideal: 640 }, height: { ideal: 480 } },
                audio: false
            });
            streamCameraAtiva = stream;
            video.srcObject = stream;
            video.style.transform = usarLenteFrontal ? "scaleX(-1)" : "none";
            
            video.onloadedmetadata = () => {
                video.play().then(() => {
                    iniciarValidacaoAnatomicaMatematica();
                }).catch(e => {
                    virtyAlert("Toque no vídeo para ativar a transmissão da câmera.");
                });
            };
        } catch (err) {
            virtyAlert("Permissão da câmera é necessária para prosseguir.");
        }
    }

    function alternarLenteCamera() {
        usarLenteFrontal = !usarLenteFrontal;
        inicializarCapturaVideo();
    }

    /* MOTOR ULTRA-LEVE DE VALIDAÇÃO DE ANATOMIA FACIAL (OLHOS, NARIZ E BOCA) */
    function iniciarValidacaoAnatomicaMatematica() {
        const video = document.getElementById('v-vis');
        const statusTxt = document.getElementById('status-foto');
        const btnSelfie = document.getElementById('btn-bater-selfie');
        const elipse = document.getElementById('elipse-guia');

        const canvasAnalysis = document.createElement('canvas');
        const ctxAnalysis = canvasAnalysis.getContext('2d', { willReadFrequently: true });
        canvasAnalysis.width = 120;
        canvasAnalysis.height = 150;

        if (loopValidacaoFacial) clearInterval(loopValidacaoFacial);

        loopValidacaoFacial = setInterval(() => {
            if (!video || video.paused || video.ended || video.readyState < 2) return;

            try {
                // Desenha o frame central do vídeo em um micro-canvas
                ctxAnalysis.drawImage(video, 0, 0, 120, 150);
                const frame = ctxAnalysis.getImageData(0, 0, 120, 150);
                const pixels = frame.data;

                let brilhoOlhos = 0, brilhoNariz = 0, brilhoBoca = 0, tomPele = 0;
                let totalOlhos = 0, totalNariz = 0, totalBoca = 0;

                for (let y = 0; y < 150; y++) {
                    for (let x = 0; x < 120; x++) {
                        const index = (y * 120 + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];
                        const luma = (r * 0.299 + g * 0.587 + b * 0.114);

                        // Região da Testa/Olhos (y: 35 a 65)
                        if (y >= 35 && y <= 65 && x >= 20 && x <= 100) {
                            brilhoOlhos += luma;
                            totalOlhos++;
                        }
                        // Região do Nariz (y: 66 a 95)
                        else if (y >= 66 && y <= 95 && x >= 35 && x <= 85) {
                            brilhoNariz += luma;
                            totalNariz++;
                        }
                        // Região da Boca/Queixo (y: 96 a 130)
                        else if (y >= 96 && y <= 130 && x >= 30 && x <= 90) {
                            brilhoBoca += luma;
                            totalBoca++;
                        }
                    }
                }

                const medOlhos = brilhoOlhos / (totalOlhos || 1);
                const medNariz = brilhoNariz / (totalNariz || 1);
                const medBoca = brilhoBoca / (totalBoca || 1);

                // Regras da Estrutura Facial Humana:
                // 1. Nariz reflete mais luz central do que as cavidades dos olhos/sobrancelhas
                // 2. A região da boca possui gradiente de contraste em relação ao centro do rosto
                // 3. Impede dedos ou paredes lisas (onde a luminosidade é 100% uniforme)
                const difOlhosNariz = Math.abs(medNariz - medOlhos);
                const difBocaNariz = Math.abs(medNariz - medBoca);
                const variacaoGeral = difOlhosNariz + difBocaNariz;

                // Validação de presença de feições humanas equilibradas
                if (variacaoGeral > 4 && variacaoGeral < 75 && medNariz > 20) {
                    elipse.classList.add('encaixado');
                    statusTxt.innerText = "ROSTO DETECTADO!";
                    statusTxt.className = "texto-neon-verde";
                    btnSelfie.disabled = false;
                } else {
                    elipse.classList.remove('encaixado');
                    statusTxt.innerText = "ENCAIXE O ROSTO NO OVAL";
                    statusTxt.className = "texto-neon-vermelho";
                    btnSelfie.disabled = true;
                }
            } catch (e) {
                elipse.classList.remove('encaixado');
                btnSelfie.disabled = true;
            }
        }, 200);
    }

    function capturarSelfieManual() {
        const v = document.getElementById('v-vis');
        const c = document.getElementById('c-vis');
        if (!v || !c || v.videoWidth === 0) return;

        c.width = v.videoWidth;
        c.height = v.videoHeight;
        const ctx = c.getContext('2d');

        if (usarLenteFrontal) {
            ctx.translate(c.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(v, 0, 0, c.width, c.height);

        visitanteFotoBase64 = c.toDataURL('image/jpeg', 0.6);
        encerrarStreamCamera();
        
        mudarTela('s-inicio');
    }

    function dispararInterfone() {
        const un = document.getElementById('v-un').value.trim();
        const txt = document.getElementById('v-texto').value.trim();

        if (!un) { virtyAlert("Digite o número do apartamento ou casa."); return; }
        if (!visitanteFotoBase64) { virtyAlert("Erro na fotografia. Tente novamente."); resetarFluxoVisitante(); return; }

        db.ref(`bloqueados/${un}/${meu_fingerprint}`).once('value', bSnap => {
            if (bSnap.exists()) {
                virtyAlert("Acesso temporariamente suspenso para esta unidade.");

            }

            chamadaIdGlobal = un;
            db.ref('chamadas_ativas/' + un).set({
                v_id: meu_fingerprint,
                foto: visitanteFotoBase64,
                texto: txt || "Visitante na porta",
                status: "chamando",
                ts: Date.now()
            }).then(() => {
                mudarTela('s-chamando');
                document.getElementById('texto-unidade-chamando').innerHTML = `CHAMANDO<br>CASA ${un}`;
                iniciarAcompanhamentoResposta(un);
            }).catch(() => {
                virtyAlert("Erro ao iniciar a chamada. Verifique sua conexão.");
            });
        });
    }

    function iniciarAcompanhamentoResposta(un) {
        tempoRestanteChamada = 90;
        const timerElem = document.getElementById('timer-chamada');
        const statusElem = document.getElementById('virty-status-tempo-real');

        if (timerRegressivoInterval) clearInterval(timerRegressivoInterval);
        timerRegressivoInterval = setInterval(() => {
            tempoRestanteChamada--;
            if (timerElem) timerElem.innerText = `AGUARDE: ${tempoRestanteChamada}s`;
            if (tempoRestanteChamada <= 0) {
                finalizarChamadaExpirada();
            }
        }, 1000);

        if (escutadorFirebaseAtivo) escutadorFirebaseAtivo.off();
        escutadorFirebaseAtivo = db.ref('chamadas_ativas/' + un);

        escutadorFirebaseAtivo.on('value', snap => {
            const data = snap.val();
            if (!data) return;

            if (data.status === 'escrevendo') {
                statusElem.innerText = "MORADOR DIGITANDO...";
                statusElem.className = "texto-neon-azul pulsar";
            } else if (data.status === 'gravando') {
                statusElem.innerText = "MORADOR GRAVANDO ÁUDIO...";
                statusElem.className = "texto-neon-vermelho pulsar";
            } else if (data.status === 'liberado') {
                exibirResultadoFinal("ENTRADA AUTORIZADA!", "Acesso liberado. Seja bem-vindo!", false);
            } else if (data.status === 'recusado') {
                exibirResultadoFinal("ENTRADA NÃO LIBERADA", "Chamada recusada pelo morador.", false);
            } else if (data.status === 'mensagem') {
                if (data.audio_b64) {
                    cacheAudioUrl = data.audio_b64;
                    exibirResultadoFinal("RECADO EM ÁUDIO", "O morador enviou uma mensagem de voz.", true);
                } else {
                    exibirResultadoFinal("MENSAGEM RECEBIDA", `"${data.msg_morador || 'Sem recado'}"`, false);
                }
            }
        });
    }

    function exibirResultadoFinal(titulo, mensagem, temAudio) {
        limparTimersEListeners();
        mudarTela('s-feedback');

        document.getElementById('titulo-feedback').innerText = titulo;
        document.getElementById('msg-feedback').innerText = mensagem;

        const containerAudio = document.getElementById('area-audio-ouvir');
        containerAudio.style.display = temAudio ? 'flex' : 'none';
    }

    function reproduzirAudioProtegido() {
        if (!cacheAudioUrl) return;
        const player = document.getElementById('audio-player-v');
        player.src = cacheAudioUrl;
        player.play().catch(() => virtyAlert("Erro ao reproduzir o áudio."));
    }

    function cancelarInterfone() {
        if (chamadaIdGlobal) {
            db.ref('chamadas_ativas/' + chamadaIdGlobal).remove();
        }
        resetarFluxoVisitante();
    }

    function finalizarChamadaExpirada() {
        if (chamadaIdGlobal) {
            db.ref('chamadas_ativas/' + chamadaIdGlobal).update({ status: 'cinza' });
        }
        exibirResultadoFinal("SEM RESPOSTA", "O morador não atendeu a chamada a tempo.", false);
    }

    function limparTimersEListeners() {
        if (timerRegressivoInterval) { clearInterval(timerRegressivoInterval); timerRegressivoInterval = null; }
        if (escutadorFirebaseAtivo) { escutadorFirebaseAtivo.off(); escutadorFirebaseAtivo = null; }
    }

    function resetarFluxoVisitante() {
        limparTimersEListeners();
        encerrarStreamCamera();
        visitanteFotoBase64 = "";
        chamadaIdGlobal = "";
        cacheAudioUrl = "";
        
        document.getElementById('v-un').value = "";
        document.getElementById('v-texto').value = "";

        mudarTela('s-boasvindas');
    }
</script>
</body>
</html>
