<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
        video { width: 90%; max-width: 500px; background: #333; border-radius: 10px; }
        button { margin-top: 30px; padding: 18px 40px; font-size: 18px; border-radius: 50px; border: none; background: #007bff; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <video id="meuVideo" playsinline autoplay muted loop src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
    <button id="btn" onclick="iniciarFluxo()">Visualizar e Abrir Portão</button>

    <script>
        const video = document.getElementById('meuVideo');

        async function iniciarFluxo() {
            try {
                // 1. Tenta ativar o modo flutuante
                await video.requestPictureInPicture();
                
                // 2. O PULO DO GATO: Redirecionar para página em branco
                // Isso faz a interface sumir instantaneamente
                window.location.replace('about:blank');
                
            } catch (error) {
                alert("Para funcionar, toque na tela antes de clicar no botão.");
            }
        }
    </script>
</body>
</html>
