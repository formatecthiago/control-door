<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Câmera</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        video { width: 100%; max-width: 500px; background: #333; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 18px; border-radius: 25px; border: none; background: #007bff; color: white; }
    </style>
</head>
<body>

    <video id="meuVideo" playsinline autoplay muted loop 
           src="https://www.w3schools.com/html/mov_bbb.mp4">
    </video>

    <button onclick="ativarPiP()">Testar Vídeo Flutuante</button>
    <p id="log" style="margin-top:20px; color: yellow;"></p>

    <script>
        const video = document.getElementById('meuVideo');
        const log = document.getElementById('log');

        async function ativarPiP() {
            try {
                // Tenta forçar o play antes de flutuar (necessário para alguns navegadores)
                await video.play();
                
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                    log.textContent = "Sucesso!";
                }
            } catch (error) {
                log.textContent = "Erro: " + error.message;
                console.error(error);
            }
        }

        // Monitor de erro do vídeo
        video.onerror = function() {
            log.textContent = "Erro: Não foi possível carregar o vídeo.";
        };
    </script>
</body>
</html>
