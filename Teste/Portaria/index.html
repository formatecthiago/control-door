<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interfone - Visualizar Câmera</title>
    <style>
        /* Estilo para deixar o visual limpo no celular */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; overflow: hidden; }
        /* Contêiner do vídeo (mantém a proporção da imagem) */
        .video-wrapper { position: relative; width: 100%; max-width: 600px; background: #222; }
        /* Tag de vídeo/imagem nativa */
        video, img { width: 100%; height: auto; display: block; border-bottom: 2px solid #333; }
        /* Área de controle abaixo do vídeo */
        .controls-area { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; gap: 15px; }
        /* Estilo dos botões */
        .btn { border: none; padding: 16px 24px; border-radius: 50px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; width: 80%; max-width: 300px; color: white; transition: background 0.3s; }
        .btn-pip { background-color: #007bff; /* Azul */ }
        .btn-pip:hover { background-color: #0056b3; }
        .btn-close { background-color: #dc3545; /* Vermelho */ padding: 12px 20px; font-size: 14px; margin-top: auto; margin-bottom: 20px; width: auto; opacity: 0.7; }
        /* Mensagem se o navegador não suportar o recurso */
        #status-message { color: #aaa; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <!-- O CONTÊINER DO VÍDEO / STREAM MJPEG -->
    <div class="video-wrapper">
        <!-- Usa o feed continuo de quadros do IP Webcam diretamente no seu player -->
        <video id="localVideo" playsinline autoplay muted loop src="http://80.2.216.179:8080/videofeed"></video>
    </div>

    <!-- ÁREA DE CONTROLES ABAIXO -->
    <div class="controls-area">
        <p id="status-message">Carregando câmera...</p>

        <!-- O BOTÃO MÁGICO DO SEU PROJETO -->
        <button class="btn btn-pip" id="pipButton" onclick="togglePiP()">
            Visualizar e Abrir Portão
        </button>

        <p id="sub-message" style="display:block; color: #666; font-size: 12px; margin-top: 5px; text-align: center;">
            Ao clicar, o vídeo ficará flutuante.<br>Volte para a chamada para digitar o código.
        </p>

        <!-- BOTÃO PARA FECHAR A PÁGINA -->
        <button class="btn btn-close" onclick="window.close()">Fechar</button>
    </div>

    <!-- JAVASCRIPT: A LÓGICA DO MODO FLUTUANTE -->
    <script>
        const video = document.getElementById('localVideo');
        const pipButton = document.getElementById('pipButton');
        const statusMessage = document.getElementById('status-message');

        // Verifica se o navegador suporta Picture-in-Picture
        if ('pictureInPictureEnabled' in document) {
            pipButton.style.display = 'block'; 
            statusMessage.textContent = "Câmera Online";
        } else {
            pipButton.style.display = 'none'; 
            statusMessage.textContent = "Modo flutuante não suportado neste navegador.";
        }

        async function togglePiP() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                    pipButton.textContent = "Visualizar e Abrir Portão";
                } else {
                    await video.requestPictureInPicture();
                    pipButton.textContent = "Voltar para Página Normal";
                }
            } catch (error) {
                console.error("Falha ao ativar modo PiP:", error);
                alert("Ocorreu um erro ao tentar ativar o vídeo flutuante. Verifique se o stream está ativo.");
            }
        }

        video.addEventListener('leavepictureinpicture', () => {
            pipButton.textContent = "Visualizar e Abrir Portão";
        });
    </script>
</body>
</html>
