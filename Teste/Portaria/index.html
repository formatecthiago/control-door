<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; transition: opacity 0.5s; }
        #interface-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        video { width: 90%; max-width: 500px; background: #111; border-radius: 10px; min-height: 250px; object-fit: cover; }
        button { margin-top: 30px; padding: 18px 40px; font-size: 18px; border-radius: 50px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        .ocultar { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <div id="interface-container">
        <!-- Player WebRTC para câmera de segurança ao vivo -->
        <video id="meuVideo" playsinline autoplay muted controls></video>
        <button onclick="ativarPiP()">Visualizar a Portaria</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const video = document.getElementById('meuVideo');
        const container = document.getElementById('interface-container');

        // Conexão WebRTC com stream real de câmera ao vivo
        async function conectarCameraReal() {
            const pc = new RTCPeerConnection();
            
            pc.addTransceiver('video', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                video.srcObject = event.streams[0];
            };

            // Servidor de teste público rodando o protocolo go2rtc
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch('https://rtsp.me/fe/webrtc?url=rtsp://wowzaec2demo.streamlock.net/vod/mp4:BigBuckBunny_H264_512x288.mp4', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });

                if (response.ok) {
                    const sdp = await response.text();
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp }));
                } else {
                    usarFallbackDirectStream();
                }
            } catch (e) {
                usarFallbackDirectStream();
            }
        }

        // Fallback para transmissão de vídeo IP contínuo
        function usarFallbackDirectStream() {
            video.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        }

        conectarCameraReal();

        // Lógica do Picture-in-Picture
        async function ativarPiP() {
            try {
                await video.requestPictureInPicture();
            } catch (error) {
                alert("Aguarde a transmissão iniciar antes de flutuar.");
            }
        }

        video.addEventListener('enterpictureinpicture', () => container.classList.add('ocultar'));
        video.addEventListener('leavepictureinpicture', () => container.classList.remove('ocultar'));
    </script>
</body>
</html>
