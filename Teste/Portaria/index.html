<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Portaria Digital PWA</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px; /* Tamanho compacto ideal para o morador */
            background: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Moldura de Exibição Compacta (Upscaling CSS ativado) */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 220px; /* Moldura fixa e confortável */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* A imagem pequena vinda do 4G expande para preencher a moldura sem pescar a rede */
        #frameImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast; /* Suaviza a ampliação */
            display: block;
        }

        #pipCanvas, #pipVideo { display: none; }

        .status-bar {
            margin: 15px 0;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4757;
        }

        .status-dot.online { background-color: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-dot.repouso { background-color: #eccc68; box-shadow: 0 0 8px #eccc68; }

        .btn-action {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }

        .btn-action:active { transform: scale(0.98); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>Portaria - Monitoramento</h2>

        <div class="video-wrapper">
            <img id="frameImg" src="https://picsum.photos/400/225" alt="Buscando sinal da portaria...">
            <canvas id="pipCanvas" width="400" height="225"></canvas>
            <video id="pipVideo" autoplay playsinline muted></video>
        </div>

        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusTxt">Conectando...</span>
        </div>

        <button class="btn-action" onclick="togglePip()">Visualizar Portaria (Janela Flutuante)</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB7ZpRwKPS8bZczhoQ5MUzXlYVB0nYKj-8",
            authDomain: "portaria-cam.firebaseapp.com",
            databaseURL: "https://portaria-cam-default-rtdb.firebaseio.com",
            projectId: "portaria-cam",
            storageBucket: "portaria-cam.firebasestorage.app",
            messagingSenderId: "271848073619",
            appId: "1:271848073619:web:4bab1cfb13a479ca596066"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const frameImg = document.getElementById('frameImg');
        const statusTxt = document.getElementById('statusTxt');
        const statusDot = document.getElementById('statusDot');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipVideo = document.getElementById('pipVideo');
        const ctx = pipCanvas.getContext('2d');

        let timerRepouso = null;

        // Monitor de recebimento de frames
        database.ref('camera/frame').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                frameImg.src = data;
                
                // Indica sinal AO VIVO / MOVIMENTO
                statusTxt.textContent = "Portaria: Movimento detectado (Ao Vivo)";
                statusDot.className = "status-dot online";
                atualizarCanvas();

                // Reseta o temporizador de detecção de repouso (se não chegar novo frame em 5 segs, assume repouso)
                clearTimeout(timerRepouso);
                timerRepouso = setTimeout(() => {
                    statusTxt.textContent = "Portaria: Sem movimento (Imagem em Repouso)";
                    statusDot.className = "status-dot repouso";
                }, 5000); 
            }
        });

        function atualizarCanvas() {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                ctx.imageSmoothingEnabled = true; // Aplica o filtro de suavização na ampliação
                ctx.drawImage(img, 0, 0, pipCanvas.width, pipCanvas.height);
            };
            img.src = frameImg.src;
        }

        async function togglePip() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    atualizarCanvas();
                    const stream = pipCanvas.captureStream(10); // 10 FPS estático para a Janela Flutuante
                    pipVideo.srcObject = stream;
                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("Navegador não suporta a Janela Flutuante ou requer permissão.");
            }
        }
    </script>
</body>
</html>
