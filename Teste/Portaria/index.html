<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria Digital</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
        
        #app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
        
        .video-box { width: 90%; aspect-ratio: 16/9; background: #000; border: 4px solid #333; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-bar { margin: 15px 0; font-size: 14px; color: #888; }
        
        button { margin-top: 20px; padding: 20px 40px; font-size: 18px; border-radius: 12px; border: none; background: #ff4757; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>

    <!-- SDKs do Firebase (Versão Compatível Web) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app-container">
        <div class="video-box">
            <img id="meuFrame" src="" alt="Aguardando conexão com a câmera...">
        </div>
        
        <div class="status-bar" id="statusTxt">Câmera Portaria: DESCONECTADA</div>
        
        <button id="btnConectar" onclick="iniciarRealtimeDB()">Acessar Câmera IP</button>
    </div>

    <script>
        // Configuração extraída da sua tela do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB7ZpRwKPS8bZczhoQ5MUzXlYVB0nYKj-8",
            authDomain: "portaria-cam.firebaseapp.com",
            databaseURL: "https://portaria-cam-default-rtdb.firebaseio.com",
            projectId: "portaria-cam",
            storageBucket: "portaria-cam.firebasestorage.app",
            messagingSenderId: "271848073619",
            appId: "1:271848073619:web:4bab1cfb13a479ca596066",
            measurementId: "G-1XJ4Q6491E"
        };

        // Inicialização do Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const statusTxt = document.getElementById('statusTxt');
        const imgElement = document.getElementById('meuFrame');

        function iniciarRealtimeDB() {
            statusTxt.textContent = "Câmera Portaria: AGUARDANDO SINAL 4G...";
            statusTxt.style.color = "#eccc68";

            // Escuta as alterações na chave 'camera/frame' no Realtime Database
            const cameraRef = database.ref('camera/frame');

            cameraRef.on('value', (snapshot) => {
                const base64Image = snapshot.val();
                if (base64Image) {
                    imgElement.src = base64Image;
                    statusTxt.textContent = "Câmera Portaria: ONLINE (Realtime 4G)";
                    statusTxt.style.color = "#00ff88";
                } else {
                    statusTxt.textContent = "Aguardando envio da imagem pelo banco...";
                    statusTxt.style.color = "#ff4757";
                }
            });
        }
    </script>
</body>
</html>
