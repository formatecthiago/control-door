<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>Portaria ao vivo</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-close-top {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        .btn-close-top:active {
            transform: scale(0.95);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 10px;
            margin-bottom: 20px;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: left;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #frameImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            display: block;
        }

        #pipCanvas, #pipVideo { display: none; }

        .status-bar {
            margin: 15px 0;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff4757;
        }

        .status-dot.online { background-color: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status-dot.repouso { background-color: #eccc68; box-shadow: 0 0 8px #eccc68; }

        .btn-action {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:active { transform: scale(0.98); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <button class="btn-close-top" onclick="fecharTudo()">
            ✖ Fechar
        </button>

        <h2>Portaria ao vivo</h2>

        <div class="video-wrapper">
            <img id="frameImg" src="https://picsum.photos/400/225" alt="Buscando sinal da portaria...">
            <canvas id="pipCanvas" width="400" height="225"></canvas>
            <video id="pipVideo" autoplay playsinline muted></video>
        </div>

        <div class="status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusTxt">Aguardando chamada...</span>
        </div>

        <button id="btnPip" class="btn-action" onclick="togglePip()">
            📺 Ativar Janela Flutuante
        </button>
    </div>

    <script>
        // Configuração atualizada para apontar para o Firebase principal
        const firebaseConfig = {
            apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM",
            databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const frameImg = document.getElementById('frameImg');
        const statusTxt = document.getElementById('statusTxt');
        const statusDot = document.getElementById('statusDot');
        const btnPip = document.getElementById('btnPip');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipVideo = document.getElementById('pipVideo');
        const ctx = pipCanvas.getContext('2d');

        let timerRepouso = null;

        // Escuta a transmissão no nó 'camera/stream' do banco correto
        database.ref('camera/stream').on('value', (snapshot) => {
            const data = snapshot.val();

            if (data && data.imagem) {
                frameImg.src = data.imagem;
                statusTxt.textContent = "Portaria: Transmissão Ativa (Ao Vivo)";
                statusDot.className = "status-dot online";
                atualizarCanvas();

                // Zera e reinicia o temporizador de ausência de sinal
                clearTimeout(timerRepouso);
                timerRepouso = setTimeout(() => {
                    marcarComoInativo();
                }, 1500); // 1.5s de tolerância para o fluxo contínuo de 4 FPS
            } else {
                // Caso o transmissor remova o nó 'camera/stream' ao desligar
                marcarComoInativo();
            }
        });

        function marcarComoInativo() {
            statusTxt.textContent = "Portaria: Sem sinal / Repouso";
            statusDot.className = "status-dot repouso";
            frameImg.src = "https://picsum.photos/400/225"; // Imagem padrão quando offline
        }

        function atualizarCanvas() {
            const img = new Image();
            img.onload = () => {
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(img, 0, 0, pipCanvas.width, pipCanvas.height);
            };
            img.src = frameImg.src;
        }

        async function togglePip() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    atualizarCanvas();
                    const stream = pipCanvas.captureStream(10);
                    pipVideo.srcObject = stream;
                    await pipVideo.play();
                    await pipVideo.requestPictureInPicture();
                }
            } catch (err) {
                alert("O navegador não suporta a janela flutuante ou é necessária uma interação.");
            }
        }

        async function fecharTudo() {
            if (document.pictureInPictureElement) {
                try {
                    await document.exitPictureInPicture();
                } catch (e) {
                    console.log("Flutuante encerrado.");
                }
            }

            window.location.href = "https://www.google.com";
        }

        pipVideo.addEventListener('enterpictureinpicture', () => {
            btnPip.innerHTML = "❌ Encerrar Flutuante";
        });

        pipVideo.addEventListener('leavepictureinpicture', () => {
            btnPip.innerHTML = "📺 Ativar Janela Flutuante";
        });
    </script>
</body>
</html>
