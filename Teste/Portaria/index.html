<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; transition: opacity 0.5s; }
        #interface-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        video { width: 90%; max-width: 500px; background: #222; border-radius: 10px; min-height: 200px; }
        button { margin-top: 30px; padding: 18px 40px; font-size: 18px; border-radius: 50px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        .ocultar { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <div id="interface-container">
        <video id="meuVideo" playsinline autoplay muted controls></video>
        <button onclick="ativarPiP()">Visualizar a Portaria</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const video = document.getElementById('meuVideo');
        const container = document.getElementById('interface-container');
        
        // Link de teste público funcional sem bloqueio de CORS
        const streamUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => console.log("Aguardando interação do usuário."));
            });

            // Tratamento de Erro de Rede ou CORS
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    alert("Erro ao carregar o vídeo da câmera. Verifique a conexão ou o link.");
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
        }

        async function ativarPiP() {
            try {
                await video.requestPictureInPicture();
            } catch (error) {
                alert("Dê o play no vídeo antes de flutuar!");
            }
        }

        video.addEventListener('enterpictureinpicture', () => container.classList.add('ocultar'));
        video.addEventListener('leavepictureinpicture', () => container.classList.remove('ocultar'));
    </script>
</body>
</html>
