<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <!-- Biblioteca para ler links de câmeras ao vivo (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; transition: opacity 0.5s; }
        
        #interface-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        video { width: 90%; max-width: 500px; background: #333; border-radius: 10px; }
        
        button { margin-top: 30px; padding: 18px 40px; font-size: 18px; border-radius: 50px; border: none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        
        .ocultar { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <div id="interface-container">
        <!-- Tag de vídeo configurada para receber a transmissão ao vivo -->
        <video id="meuVideo" playsinline autoplay muted controls></video>
        <button onclick="ativarPiP()">Visualizar a Portaria</button>
    </div>

    <script>
        // Registro do Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const video = document.getElementById('meuVideo');
        const container = document.getElementById('interface-container');
        
        // URL da Câmera Pública ao Vivo (Formato HLS .m3u8)
        const streamUrl = 'https://stream-us1.com/hls/live.m3u8';

        // Carregamento do vídeo ao vivo com Hls.js
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Suporte nativo para Safari (iOS)
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        // Lógica do Picture-in-Picture
        async function ativarPiP() {
            try {
                await video.requestPictureInPicture();
            } catch (error) {
                alert("Erro ao flutuar. Toque no play do vídeo primeiro!");
            }
        }

        video.addEventListener('enterpictureinpicture', () => {
            container.classList.add('ocultar');
        });

        video.addEventListener('leavepictureinpicture', () => {
            container.classList.remove('ocultar');
        });
    </script>
</body>
</html>
