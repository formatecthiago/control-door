<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera IP</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .quadro-camera {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 4/3;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .quadro-camera img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quadro-camera">
        <img id="imagemCamera" src="" alt="Aguardando conexão...">
    </div>

    <button onclick="conectarCamera()">Acessar Câmera IP</button>

    <script>
        function conectarCamera() {
            const img = document.getElementById('imagemCamera');
            const urlBase = 'http://80.2.216.179:8080/shot.jpg';

            // Carrega a primeira imagem imediatamente
            img.src = `${urlBase}?t=${Date.now()}`;

            // Inicia o loop para atualizar o quadro a cada 1 segundo
            setInterval(() => {
                img.src = `${urlBase}?t=${Date.now()}`;
            }, 1000);
        }
    </script>

</body>
</html>
