<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria Digital - YouTube Stream</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
        .video-container { width: 90%; max-width: 500px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #222; }
        img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Exibe a foto da câmera e atualiza em loop -->
        <img id="camFrame" src="http://80.2.216.179:8080/shot.jpg" alt="Carregando câmera...">
    </div>

    <script>
        const img = document.getElementById('camFrame');
        const baseUrl = 'http://80.2.216.179:8080/shot.jpg';

        // Atualiza a imagem a cada 1 segundo
        setInterval(() => {
            img.src = `${baseUrl}?t=${Date.now()}`;
        }, 1000);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
