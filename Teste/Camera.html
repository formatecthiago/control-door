<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Câmera - Portaria (Inteligente)</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      margin: 0 auto;
    }
    video {
      width: 320px;
      height: 240px;
      border: 2px solid #555;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #00ff00;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    #status { font-weight: bold; color: #ffbb00; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador ESP32-CAM / IP</h2>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>
    
    <button id="btn-pip" class="btn" onclick="alternarModoFlutuante()">🔲 MODO FLUTUANTE (PIP)</button>
    <p id="status">Aguardando início de chamada...</p>
  </div>

  <script>
    // Credenciais unificadas no projeto Principal
    const firebaseConfig = {
      apiKey: "AIzaSyDis1Zr3IOV-iWco8m9tUWIeL1UKVRxcEc",
      authDomain: "virty-access-door.firebaseapp.com",
      databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com",
      projectId: "virty-access-door",
      storageBucket: "virty-access-door.firebasestorage.app",
      messagingSenderId: "694822891117",
      appId: "1:694822891117:web:sua_app_id_aqui"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let intervalTransmissao = null;
    let cameraStream = null;

    // Inicialização da Câmera do Dispositivo
    navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: "environment" }, 
      audio: false 
    })
    .then((stream) => {
      cameraStream = stream;
      video.srcObject = stream;
      statusText.innerText = "Standby: Aguardando evento de chamada no Firebase...";
      
      // Monitora o estado da chamada no Firebase
      monitorarChamadas();
    })
    .catch((err) => {
      statusText.innerText = "Erro ao acessar a câmera: " + err;
      statusText.style.color = "#ff4444";
    });

    // Escuta em tempo real o status no Firebase
    function monitorarChamadas() {
      database.ref('chamada').on('value', (snapshot) => {
        const chamada = snapshot.val();

        // Se houver chamada ativa (chamando ou em atendimento)
        if (chamada && (chamada.status === 'chamando' || chamada.status === 'atendida')) {
          iniciarTransmissao();
        } else {
          pararTransmissao();
        }
      });
    }

    function iniciarTransmissao() {
      if (!intervalTransmissao) {
        statusText.innerText = "🔴 EM CHAMADA -> Transmitindo vídeo (4 FPS)!";
        statusText.style.color = "#00ff00";
        video.style.borderColor = "#00ff00";

        // 4 frames por segundo (250ms)
        intervalTransmissao = setInterval(capturarEEnviar, 250);
      }
    }

    function pararTransmissao() {
      if (intervalTransmissao) {
        clearInterval(intervalTransmissao);
        intervalTransmissao = null;

        statusText.innerText = "Standby: Chamada encerrada. Imagem em espera.";
        statusText.style.color = "#ffbb00";
        video.style.borderColor = "#555";

        // Envia frame preto de encerramento para o banco
        enviarImagemPreta();
      }
    }

    function capturarEEnviar() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 320, 240);
        const frameBase64 = canvas.toDataURL('image/jpeg', 0.30);

        database.ref('camera/stream').set({
          imagem: frameBase64,
          timestamp: Date.now()
        });
      }
    }

    function enviarImagemPreta() {
      // Cria um canvas preto transparente de espera
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, 320, 240);
      const framePreto = canvas.toDataURL('image/jpeg', 0.1);

      database.ref('camera/stream').set({
        imagem: framePreto,
        timestamp: Date.now()
      });
    }

    // Modo Janela Flutuante (PiP)
    async function alternarModoFlutuante() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error("Erro no PiP:", err);
      }
    }
  </script>
</body>
</html>
