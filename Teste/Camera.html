<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Câmera - Portaria (Virty Access Door)</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 360px;
      margin: 0 auto;
    }
    video {
      width: 320px;
      height: 240px;
      border: 2px solid #00ff00;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      border: none;
      background: #00ff00;
      color: #000;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      text-transform: uppercase;
    }
    #status { font-weight: bold; color: #ffcc00; margin-top: 15px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Simulador Câmera (Virty Door)</h2>
    
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="320" height="240" style="display: none;"></canvas>
    
    <button id="btn-pip" class="btn" onclick="alternarModoFlutuante()">🔲 MODO FLUTUANTE (PIP)</button>
    <p id="status">Aguardando estado da chamada...</p>
  </div>

  <script>
    // Configuração migrada para o projeto central VIRTY-ACCESS-DOOR
    const firebaseConfig = {
      apiKey: "AIzaSyDis1Zr3IOV-iWco8m9tUWIeL1UKVRxcEc",
      authDomain: "virty-access-door.firebaseapp.com",
      databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com",
      projectId: "virty-access-door",
      storageBucket: "virty-access-door.firebasestorage.app",
      messagingSenderId: "694822891117",
      appId: "1:694822891117:web:virty_access_door"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let intervalTransmissao = null;
    let cameraAtiva = false;

    // Inicializa a câmera local (Webcam / Celular A)
    navigator.mediaDevices.getUserMedia({ 
      video: { width: 320, height: 240, facingMode: "environment" }, 
      audio: false 
    })
    .then((stream) => {
      video.srcObject = stream;
      cameraAtiva = true;
      monitorarChamada();
    })
    .catch((err) => {
      statusText.innerText = "Erro ao acessar a câmera: " + err;
      statusText.style.color = "#ff4444";
    });

    // Monitora o nó da chamada para ativar/desativar a transmissão de quadros
    function monitorarChamada() {
      database.ref('chamada/status').on('value', (snapshot) => {
        const status = snapshot.val();

        // Transmite somente se houver chamada ativa (ex: 'tocando' ou 'atendido')
        if (status === 'tocando' || status === 'atendido' || status === true) {
          iniciarTransmissao();
        } else {
          pararTransmissao();
        }
      });
    }

    function iniciarTransmissao() {
      if (intervalTransmissao) return; // Já está rodando
      
      statusText.innerText = "Chamada Ativa! Transmitindo a 4 FPS...";
      statusText.style.color = "#00ff00";

      // 4 FPS (250ms)
      intervalTransmissao = setInterval(capturarEEnviar, 250);
    }

    function pararTransmissao() {
      if (intervalTransmissao) {
        clearInterval(intervalTransmissao);
        intervalTransmissao = null;
      }

      // Envia frame preto e limpa a stream no Firebase
      limparStreamFirebase();

      statusText.innerText = "Aguardando Chamada... (Standby)";
      statusText.style.color = "#ffcc00";
    }

    function capturarEEnviar() {
      if (cameraAtiva && video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, 320, 240);
        const frameBase64 = canvas.toDataURL('image/jpeg', 0.30);

        database.ref('camera/stream').set({
          imagem: frameBase64,
          timestamp: Date.now()
        });
      }
    }

    // Envia imagem preta ao encerrar chamada (facilita compatibilidade com ESP32 / Câmera IP)
    function limparStreamFirebase() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, 320, 240);
      const framePreto = canvas.toDataURL('image/jpeg', 0.1);

      database.ref('camera/stream').set({
        imagem: framePreto,
        timestamp: Date.now()
      });
    }

    // Alternar modo Picture-in-Picture
    async function alternarModoFlutuante() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        console.error("Erro ao ativar PiP:", err);
      }
    }
  </script>
</body>
</html>
