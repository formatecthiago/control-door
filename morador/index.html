<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIRTY MORADOR v2.0.6</title>
    <meta name="theme-color" content="#39FF14">

    <style>
        :root { --neon: #39FF14; --bg: #000; --red: #FF3131; }
        *, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .screen { display: none; min-height: 100vh; flex-direction: column; }
        .active { display: flex !important; }
        input { width: 100%; padding: 14px; margin: 6px 0; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 1rem; }
        .btn { width: 100%; padding: 16px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 8px 0; }
        .video-box { width: 160px; height: 160px; border-radius: 50%; overflow: hidden; border: 3px solid var(--neon); background:#111; margin: 0 auto 15px; position: relative; }
        .video-box video, .video-box img { width: 100%; height: 100%; object-fit: cover; }
        #debug-box { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); color: #39FF14; font-family: monospace; font-size: 11px; padding: 10px; max-height: 120px; overflow-y: auto; z-index: 9999; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <!-- Painel de Logs para diagnóstico no celular -->
    <div id="debug-box">LOGS DO SISTEMA:<br></div>

    <!-- Tela Cadastro (Visível por padrão para impedir tela preta) -->
    <div id="s-cadastro" class="screen active">
        <h2 style="color:var(--neon); text-align:center; margin: 10px 0;">CADASTRO MORADOR</h2>
        <div class="video-box">
            <video id="v-cad" autoplay playsinline muted></video>
            <img id="img-preview" src="" style="display:none;">
        </div>
        
        <!-- Input de câmera nativo do HTML como Fallback de segurança -->
        <input type="file" id="input-foto-native" accept="image/*" capture="user" style="display:none;" onchange="carregarFotoNativa(event)">
        
        <button class="btn" style="background:#fff; color:#000;" onclick="iniciarOuCapturarFoto()">📸 TIRAR FOTO</button>
        <input type="text" id="c-nome" placeholder="Nome Completo">
        <input type="number" id="c-cpf" placeholder="CPF">
        <input type="number" id="c-un" placeholder="Unidade / Apartamento">
        <button id="btn-cad" class="btn" style="background:var(--neon);" onclick="enviarCadastro()">SOLICITAR</button>
    </div>

    <!-- Tela Home -->
    <div id="s-home" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; padding-bottom:10px;">
            <b style="color:var(--neon);">VIRTY ACCESS</b>
            <span id="txt-un" style="background:var(--neon); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold;"></span>
        </div>
        <div style="text-align: center; margin-top: 50px;">
            <h3 style="color:var(--neon);">SISTEMA PRONTO</h3>
            <p style="color:#888;">Aguardando chamadas da portaria...</p>
        </div>
    </div>

    <canvas id="canvas-hidden" style="display:none;"></canvas>

<!-- Carregamento Seguro do Firebase com tratamento de erro -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    function log(msg) {
        const box = document.getElementById('debug-box');
        if(box) box.innerHTML += `> ${msg}<br>`;
        console.log(msg);
    }

    // Captura qualquer erro global do JavaScript para não deixar a tela preta
    window.onerror = function(msg, url, line) {
        log(`ERRO JS: ${msg} (Linha ${line})`);
        return true;
    };

    let db = null;
    let my_un = localStorage.getItem('my_un');
    let fotoBase64 = "";
    let streamCamera = null;

    window.onload = () => {
        log("Iniciando aplicação...");
        inicializarFirebase();
        verificarStatus();
    };

    function inicializarFirebase() {
        try {
            if (typeof firebase !== 'undefined') {
                const config = { apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM", databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com" };
                if (!firebase.apps.length) firebase.initializeApp(config);
                db = firebase.database();
                log("Firebase Conectado.");
            } else {
                log("Erro: SDK do Firebase não carregou (Sem Internet?).");
            }
        } catch(e) {
            log("Erro Firebase: " + e.message);
        }
    }

    function verificarStatus() {
        if(!my_un) { 
            mudarTela('s-cadastro'); 
            return; 
        }
        document.getElementById('txt-un').innerText = `UN: ${my_un}`;
        if(db) {
            db.ref('moradores_validados/' + my_un).once('value')
            .then(s => {
                if(s.exists()) mudarTela('s-home');
                else mudarTela('s-cadastro');
            })
            .catch(e => {
                log("Erro consulta BD: " + e.message);
                mudarTela('s-cadastro');
            });
        }
    }

    function iniciarOuCapturarFoto() {
        const video = document.getElementById('v-cad');
        
        if (!streamCamera) {
            log("Solicitando câmera...");
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => { 
                    streamCamera = stream;
                    video.srcObject = stream;
                    video.play();
                    log("Câmera ativa. Toque novamente para fotografar.");
                })
                .catch(err => { 
                    log("Câmera bloqueada. Usando seletor nativo.");
                    document.getElementById('input-foto-native').click();
                });
            } else {
                document.getElementById('input-foto-native').click();
            }
        } else {
            capturarFrame();
        }
    }

    function capturarFrame() {
        const video = document.getElementById('v-cad');
        const canvas = document.getElementById('canvas-hidden');
        const imgPreview = document.getElementById('img-preview');

        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        fotoBase64 = canvas.toDataURL('image/jpeg', 0.5);
        imgPreview.src = fotoBase64;
        imgPreview.style.display = 'block';
        video.style.display = 'none';

        if (streamCamera) {
            streamCamera.getTracks().forEach(track => track.stop());
            streamCamera = null;
        }
        log("Foto capturada com sucesso.");
    }

    function carregarFotoNativa(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64 = e.target.result;
                const imgPreview = document.getElementById('img-preview');
                imgPreview.src = fotoBase64;
                imgPreview.style.display = 'block';
                document.getElementById('v-cad').style.display = 'none';
                log("Foto selecionada via câmera do sistema.");
            };
            reader.readAsDataURL(file);
        }
    }

    function enviarCadastro() {
        const nome = document.getElementById('c-nome').value.trim();
        const cpf = document.getElementById('c-cpf').value.trim();
        const un = document.getElementById('c-un').value.trim();

        if (!nome || !cpf || !un) {
            alert("Preencha todos os campos!");
            return;
        }

        if(!db) {
            alert("Banco de dados indisponível. Verifique a conexão.");
            return;
        }

        log("Enviando cadastro...");
        db.ref('moradores_validados/' + un).set({
            nome: nome, cpf: cpf, unidade: un, foto: fotoBase64, timestamp: Date.now()
        })
        .then(() => {
            localStorage.setItem('my_un', un);
            my_un = un;
            log("Cadastro concluído!");
            mudarTela('s-home');
        })
        .catch(err => log("Erro ao salvar: " + err.message));
    }

    function mudarTela(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
    }
</script>
</body>
</html>
