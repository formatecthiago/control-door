<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIRTY MORADOR v2.0.2 - TESTE ESTABILIDADE</title>
    
    <meta name="theme-color" content="#39FF14">

    <!-- CSS mantido idêntico para não quebrar a interface -->
    <style>
        :root { --neon: #39FF14; --bg: #000; --red: #FF3131; --blue: #007BFF; --gray: #666; --yellow: #FFD700; --dark-card: #0d0d0d; }
        *, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-user-select: none; user-select: none; }
        .screen { display: none; padding: 20px; min-height: 100vh; flex-direction: column; }
        .active { display: flex !important; }
        input { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: 2px solid #222; background: #111; color: #fff; font-size: 1.1rem; }
        .btn { width: 100%; padding: 18px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 8px 0; }
        .btn:disabled { background: #333 !important; color: #666 !important; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; margin-bottom: 20px; }
        .controles-alerta { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn-mini { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 12px 20px; border-radius: 12px; font-size: 1.3rem; min-width: 65px; }
        #painel-chamada { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
        .foto-v { width: 220px; height: 220px; border-radius: 50%; border: 4px solid var(--neon); object-fit: cover; margin-bottom: 15px; }
        #timer-regressivo { font-size: 3rem; color: var(--red); font-weight: bold; margin-bottom: 10px; }
        .video-box { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; border: 3px solid var(--neon); background:#111; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <!-- Conteúdo HTML mantido igual -->
    <div id="s-cadastro" class="screen">
        <h2 style="color:var(--neon); text-align:center;">CADASTRO MORADOR</h2>
        <div class="video-box" style="margin: 0 auto 20px;"><video id="v-cad" autoplay playsinline muted></video></div>
        <button class="btn" style="background:#fff; color:#000;" onclick="fotoCad()">📸 CAPTURAR</button>
        <input type="text" id="c-nome" placeholder="Nome">
        <input type="number" id="c-cpf" placeholder="CPF">
        <input type="number" id="c-un" placeholder="Apt">
        <button id="btn-finalizar-cad" class="btn" style="background:var(--neon);" onclick="enviarCadastro()">SOLICITAR</button>
    </div>

    <div id="s-home" class="screen">
        <div class="header">
            <b style="color:var(--neon);">VIRTY ACCESS DOOR</b>
            <span id="txt-un" style="background:var(--neon); color:#000; padding:4px 12px; border-radius:6px;"></span>
        </div>
        <div id="lista-hist"></div>
    </div>

    <div id="painel-chamada">
        <div id="timer-regressivo">90</div>
        <img id="foto-v" class="foto-v" src="">
        <button class="btn" style="background:var(--neon);" onclick="responder('liberado')">AUTORIZAR ENTRADA</button>
    </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    const config = { apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM", databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(config);
    const db = firebase.database();
    
    let my_un = localStorage.getItem('my_un');
    let somInterfoneLocal = null;
    let somTocandoAtualmente = false; 

    // --- MUDANÇA 1: Removido listener de resume ---
    // O evento de 'resume' causava loop infinito em aparelhos antigos
    
    window.onload = () => {
        verificarStatus();
        verificarPermissoesObg();
    };

    function verificarStatus() {
        if(!my_un) { mudarTela('s-cadastro'); return; }
        db.ref('moradores_validados/' + my_un).once('value', s => { // Usando once para evitar listeners infinitos
            if(s.exists()) {
                mudarTela('s-home');
                escutarChamadas();
            } else {
                mudarTela('s-cadastro');
            }
        });
    }

    function gerenciarAlerta(acao, arquivoSomOpcional) {
        if(acao === 'stop') { 
            if(somInterfoneLocal) { somInterfoneLocal.pause(); somInterfoneLocal.currentTime = 0; somInterfoneLocal = null; }
            somTocandoAtualmente = false;
            // --- MUDANÇA 2: Vibração comentada para evitar travamento de hardware ---
            // if (navigator.vibrate) navigator.vibrate(0); 
            return; 
        }

        // --- MUDANÇA 2: Vibração comentada para evitar travamento de hardware ---
        // if(modoAlerta === 2 || modoAlerta === 3) { ... dispararPulso ... }

        if(!somTocandoAtualmente) {
            const arquivoFinal = arquivoSomOpcional || "sound01.mp3";
            somInterfoneLocal = new Audio(`sound/${arquivoFinal}`);
            somInterfoneLocal.loop = true; 
            somTocandoAtualmente = true;
            somInterfoneLocal.play().catch(() => { somTocandoAtualmente = false; });
        }
    }

    // --- MUDANÇA 3: Funções de câmera com verificação de erro ---
    function inicializarCapturaVideo() {
        const video = document.getElementById('v-cad');
        if (!video) return;
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { console.log("Câmera indisponível:", err); });
    }

    async function verificarPermissoesObg() {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Camera) {
            try {
                // Apenas checa, não força o pedido em loop
                const status = await window.Capacitor.Plugins.Camera.checkPermissions();
                return status.camera === 'granted';
            } catch (e) { return false; }
        }
    }

    function mudarTela(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 's-cadastro') inicializarCapturaVideo();
    }

    function responder(st) {
        document.getElementById('painel-chamada').style.display = 'none';
        gerenciarAlerta('stop');
        db.ref('chamadas_ativas/' + my_un).update({ status: st });
        setTimeout(() => db.ref('chamadas_ativas/' + my_un).remove(), 1000);
        mudarTela('s-home');
    }

    function escutarChamadas() {
        db.ref('chamadas_ativas/' + my_un).on('value', s => {
            const d = s.val();
            if(d && d.status === 'chamando') {
                document.getElementById('painel-chamada').style.display = 'flex';
                gerenciarAlerta('start');
            } else {
                document.getElementById('painel-chamada').style.display = 'none';
                gerenciarAlerta('stop');
            }
        });
    }

</script>
</body>
</html>
