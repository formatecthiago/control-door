<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIRTY MORADOR v2.0.5</title>
    
    <meta name="theme-color" content="#39FF14">

    <style>
        :root { --neon: #39FF14; --bg: #000; --red: #FF3131; --blue: #007BFF; --gray: #666; --yellow: #FFD700; --dark-card: #0d0d0d; }
        *, *::before, *::after { box-sizing: border-box; touch-action: manipulation; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-user-select: none; user-select: none; }
        .screen { display: none; padding: 20px; min-height: 100vh; flex-direction: column; }
        .active { display: flex !important; }
        input { width: 100%; padding: 16px; margin: 8px 0; border-radius: 12px; border: 2px solid #222; background: #111; color: #fff; font-size: 1.1rem; }
        .btn { width: 100%; padding: 18px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin: 8px 0; }
        .btn:disabled { background: #333 !important; color: #666 !important; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 15px; margin-bottom: 20px; }
        #painel-chamada { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
        .foto-v { width: 220px; height: 220px; border-radius: 50%; border: 4px solid var(--neon); object-fit: cover; margin-bottom: 15px; }
        #timer-regressivo { font-size: 3rem; color: var(--red); font-weight: bold; margin-bottom: 10px; }
        .video-box { width: 180px; height: 180px; border-radius: 50%; overflow: hidden; border: 3px solid var(--neon); background:#111; margin: 0 auto 20px; position: relative; }
        .video-box video, .video-box img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .status-msg { color: var(--neon); text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Tela Cadastro (Ativa por padrão para evitar tela preta se houver falha de JS) -->
    <div id="s-cadastro" class="screen active">
        <h2 style="color:var(--neon); text-align:center;">CADASTRO MORADOR</h2>
        <div class="video-box">
            <video id="v-cad" autoplay playsinline muted></video>
            <img id="img-preview" src="" style="display:none;">
        </div>
        <button class="btn" style="background:#fff; color:#000;" onclick="fotoCad()">📸 CAPTURAR FOTO</button>
        <input type="text" id="c-nome" placeholder="Nome Completo">
        <input type="number" id="c-cpf" placeholder="CPF (apenas números)">
        <input type="number" id="c-un" placeholder="Unidade / Apartamento">
        <div id="msg-cad" class="status-msg"></div>
        <button id="btn-finalizar-cad" class="btn" style="background:var(--neon);" onclick="enviarCadastro()">SOLICITAR</button>
    </div>

    <!-- Tela Home -->
    <div id="s-home" class="screen">
        <div class="header">
            <b style="color:var(--neon);">VIRTY ACCESS DOOR</b>
            <span id="txt-un" style="background:var(--neon); color:#000; padding:4px 12px; border-radius:6px;"></span>
        </div>
        <div style="text-align: center; margin-top: 40px;">
            <h3>Aguardando Chamadas...</h3>
            <p style="color:#666;">Seu dispositivo está ativo para esta unidade.</p>
        </div>
    </div>

    <!-- Painel Atendimento -->
    <div id="painel-chamada">
        <div id="timer-regressivo">90</div>
        <img id="foto-v" class="foto-v" src="">
        <button class="btn" style="background:var(--neon);" onclick="responder('liberado')">AUTORIZAR ENTRADA</button>
    </div>

    <canvas id="canvas-hidden" style="display:none;"></canvas>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    const config = { apiKey: "AIzaSyCyOvvGYTCe6EBb8BC20-oHW6ClWYJZFiM", databaseURL: "https://virty-access-door-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(config);
    const db = firebase.database();
    
    let my_un = localStorage.getItem('my_un');
    let fotoBase64 = "";
    let streamCamera = null;

    window.onload = () => {
        // Exibe a interface primeiro
        verificarStatus();
        // Em seguida tenta inicializar a câmera
        inicializarCapturaVideo();
    };

    function verificarStatus() {
        if(!my_un) { 
            mudarTela('s-cadastro'); 
            return; 
        }
        document.getElementById('txt-un').innerText = `UN: ${my_un}`;
        db.ref('moradores_validados/' + my_un).once('value', s => {
            if(s.exists()) {
                mudarTela('s-home');
                escutarChamadas();
            } else {
                mudarTela('s-cadastro');
            }
        }).catch(() => {
            mudarTela('s-cadastro');
        });
    }

    async function inicializarCapturaVideo() {
        const video = document.getElementById('v-cad');
        if (!video) return;

        // Pedido de permissão nativa sem travar o app se falhar
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Camera) {
            try {
                await window.Capacitor.Plugins.Camera.requestPermissions();
            } catch (e) {
                console.log("Aviso: Falha ao solicitar permissão nativa", e);
            }
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { 
                streamCamera = stream;
                video.srcObject = stream; 
                video.play();
                document.getElementById('msg-cad').innerText = "";
            })
            .catch(err => { 
                document.getElementById('msg-cad').innerText = "Toque em 'CAPTURAR FOTO' para permitir o uso da câmera.";
            });
        }
    }

    function fotoCad() {
        const video = document.getElementById('v-cad');
        const canvas = document.getElementById('canvas-hidden');
        const imgPreview = document.getElementById('img-preview');

        // Se o stream contínuo falhou, força a tentativa no clique do botão
        if (!streamCamera) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                streamCamera = stream;
                video.srcObject = stream;
                video.play();
                setTimeout(() => capturarFrame(video, canvas, imgPreview), 500);
            })
            .catch(() => {
                alert("Permissão de câmera negada nas configurações do Android.");
            });
            return;
        }

        capturarFrame(video, canvas, imgPreview);
    }

    function capturarFrame(video, canvas, imgPreview) {
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        fotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
        imgPreview.src = fotoBase64;
        imgPreview.style.display = 'block';
        video.style.display = 'none';

        if (streamCamera) {
            streamCamera.getTracks().forEach(track => track.stop());
            streamCamera = null;
        }
    }

    function enviarCadastro() {
        const nome = document.getElementById('c-nome').value.trim();
        const cpf = document.getElementById('c-cpf').value.trim();
        const un = document.getElementById('c-un').value.trim();
        const btn = document.getElementById('btn-finalizar-cad');

        if (!nome || !cpf || !un) {
            alert("Preencha todos os campos!");
            return;
        }

        btn.disabled = true;
        document.getElementById('msg-cad').innerText = "Enviando cadastro...";

        const dadosCadastro = {
            nome: nome,
            cpf: cpf,
            unidade: un,
            foto: fotoBase64 || "",
            timestamp: Date.now()
        };

        db.ref('moradores_validados/' + un).set(dadosCadastro)
        .then(() => {
            localStorage.setItem('my_un', un);
            my_un = un;
            document.getElementById('msg-cad').innerText = "Cadastro realizado!";
            setTimeout(() => {
                btn.disabled = false;
                mudarTela('s-home');
                verificarStatus();
            }, 1000);
        })
        .catch(err => {
            btn.disabled = false;
            document.getElementById('msg-cad').innerText = "Erro ao enviar: " + err.message;
        });
    }

    function mudarTela(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const telaAlvo = document.getElementById(id);
        if (telaAlvo) telaAlvo.classList.add('active');
    }

    function responder(st) {
        document.getElementById('painel-chamada').style.display = 'none';
        db.ref('chamadas_ativas/' + my_un).update({ status: st });
        setTimeout(() => db.ref('chamadas_ativas/' + my_un).remove(), 1000);
    }

    function escutarChamadas() {
        db.ref('chamadas_ativas/' + my_un).on('value', s => {
            const d = s.val();
            if(d && d.status === 'chamando') {
                document.getElementById('painel-chamada').style.display = 'flex';
                if(d.foto) document.getElementById('foto-v').src = d.foto;
            } else {
                document.getElementById('painel-chamada').style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
