name: Build Android APK (Portaria)

on:
  push:
    branches: [ "portaria" ] # <-- ISOLADO: Só roda na branch portaria!
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependências
        working-directory: ./Teste/Portaria
        run: |
          npm install

      - name: 5. Estruturar Pasta Web (www)
        working-directory: ./Teste/Portaria
        run: |
          mkdir -p www
          cp -r index.html bridge.js manifest.json icon-192.png www/ 2>/dev/null || true

      - name: 6. Adicionar e Sincronizar Plataforma Android
        working-directory: ./Teste/Portaria
        run: |
          npx cap add android || echo "Plataforma android ja existe"
          npx cap sync android

      - name: 7. Injetar o Robô Nativo com Notificação (CallReceiver.java)
        run: |
          # CORRIGIDO para bater exatamente com o appId: com.portaria.controle
          JAVA_DIR="Teste/Portaria/android/app/src/main/java/com/portaria/controle"
          mkdir -p "$JAVA_DIR"
          
          cat << 'EOF' > "$JAVA_DIR/CallReceiver.java"
          package com.portaria.controle;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.telephony.TelephonyManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;

          public class CallReceiver extends BroadcastReceiver {
              private static final String TAG = "CallReceiverDebug";
              private static final String CHANNEL_ID = "portaria_calls";

              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      String state = intent.getStringExtra(TelephonyManager.EXTRA_STATE);
                      if (TelephonyManager.EXTRA_STATE_RINGING.equals(state)) {
                          String incomingNumber = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER);
                          Log.d(TAG, "Chamada detectada! Número: " + incomingNumber);

                          showNotification(context, "Chamada da Portaria detectada!", "Toque para abrir a câmera ao vivo.");
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Erro ao processar chamada", e);
                  }
              }

              private void showNotification(Context context, String title, String message) {
                  NotificationManager notificationManager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Alertas da Portaria", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("Canal para chamadas da portaria");
                      notificationManager.createNotificationChannel(channel);
                  }

                  Intent notificationIntent = context.getPackageManager().getLaunchIntentForPackage(context.getPackageName());
                  if (notificationIntent != null) {
                      notificationIntent.setFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  }
                  
                  PendingIntent pendingIntent = PendingIntent.getActivity(context, 0, notificationIntent, PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setContentTitle(title)
                          .setContentText(message)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setAutoCancel(true)
                          .setContentIntent(pendingIntent);

                  notificationManager.notify(1001, builder.build());
              }
          }
          EOF

      - name: 8. Configurar Permissões e o Receiver no AndroidManifest.xml
        run: |
          MANIFEST_PATH=$(find Teste/Portaria/android -name AndroidManifest.xml | head -n 1)
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST_PATH"
            
            sed -i '/<\/application>/i \    <receiver android:name=".CallReceiver" android:exported="true">\n        <intent-filter>\n            <action android:name="android.intent.action.PHONE_STATE" />\n        </intent-filter>\n    </receiver>' "$MANIFEST_PATH"
          fi

      - name: 9. Copiar Google Services para o Android Nativo
        run: |
          mkdir -p Teste/Portaria/android/app
          cp Teste/Portaria/google-services.json Teste/Portaria/android/app/ 2>/dev/null || true

      - name: 10. Gerar APK Debug
        run: |
          GRADLEW_PATH=$(find Teste/Portaria/android -name gradlew)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 11. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Portaria-APK
          path: "**/app-debug.apk"
