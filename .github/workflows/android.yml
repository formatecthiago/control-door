name: Build Android APK (Portaria)

on:
  push:
    branches: [ "portaria", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependências e Plugins do Capacitor
        working-directory: ./Teste/Portaria
        run: |
          npm install

      - name: 5. Estruturar Pasta Web (www)
        working-directory: ./Teste/Portaria
        run: |
          mkdir -p www
          cp -r index.html bridge.js manifest.json icon-192.png www/ 2>/dev/null || true

      - name: 6. Adicionar e Sincronizar Plataforma Android
        working-directory: ./Teste/Portaria
        run: |
          npx cap add android || echo "Plataforma android ja existe"
          npx cap sync android

      - name: 7. Injetar Permissões do Android (Telefonia + Câmera + Áudio)
        run: |
          MANIFEST_PATH=$(find Teste/Portaria/android -name AndroidManifest.xml | head -n 1)
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST_PATH"
          fi

      - name: 8. Copiar Google Services para o Android Nativo
        run: |
          mkdir -p Teste/Portaria/android/app
          cp Teste/Portaria/google-services.json Teste/Portaria/android/app/ 2>/dev/null || true

      - name: 9. Gerar APK Debug
        run: |
          GRADLEW_PATH=$(find Teste/Portaria/android -name gradlew)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 10. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Portaria-APK
          path: "**/app-debug.apk"
