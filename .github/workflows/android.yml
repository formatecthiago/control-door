name: Reset Full - Build APK Capacitor 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (Ambiente Estável)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java 21 (Exigência do Android Moderno)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Configurar Android SDK Oficial
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências e Plugin Push FCM
        working-directory: ./morador-apk
        run: |
          npm install
          npm install @capacitor/push-notifications

      - name: 5.5. Transferir Web Assets (Ponte Automatizada)
        run: |
          mkdir -p morador-apk/www
          rm -rf morador-apk/www/*
          cp -r morador/* morador-apk/www/

      - name: 6. Sincronizar e Criar Estrutura Android Nativa
        working-directory: ./morador-apk
        run: |
          npx cap add android || echo "Pasta android já existe"
          npx cap sync android

      - name: 6.5. Injetar Permissões de Alta Prioridade, Tela Cheia e Sons Nativos
        working-directory: ./morador-apk
        run: |
          # 1. Permissões de Câmera, Áudio e Vibração
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-feature android:name="android.hardware.camera" android:required="true" />' android/app/src/main/AndroidManifest.xml
          
          # 2. Permissões Críticas para ACORDAR o Celular e Abrir Tela Bloqueada
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />' android/app/src/main/AndroidManifest.xml

          # 3. Força a Activity Nativa a Acender e Desbloquear a Tela na Chamada
          sed -i 's/<activity/<activity android:showWhenLocked="true" android:turnScreenOn="true" /g' android/app/src/main/AndroidManifest.xml

          # 4. Libera Navegação Nofail no WebView
          sed -i '/<\/capabilities>/i \    <allow-navigation href="*" />' android/app/src/main/res/xml/config.xml || echo "Config nativa ajustada"

          # 5. Copia Sons de Chamada para a Pasta Nativa do Android (res/raw)
          mkdir -p android/app/src/main/res/raw
          cp www/sound/*.mp3 android/app/src/main/res/raw/ || echo "Sons copiados para o sistema nativo"

      - name: 7. Compilar o APK Nativo Puro
        working-directory: ./morador-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Disponibilizar Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtyMorador-ResetFull-APK
          path: morador-apk/android/app/build/outputs/apk/debug/app-debug.apk
