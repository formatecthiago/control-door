name: Build APK Virty Morador

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (Ambiente Estável)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java 21 (Exigência do Android Moderno)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Configurar Android SDK Oficial
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências do Projeto
        working-directory: ./morador-apk
        run: |
          npm install

      - name: 5.5. Transferir Web Assets (Ponte Automatizada)
        run: |
          mkdir -p morador-apk/www
          rm -rf morador-apk/www/*
          cp -r morador/* morador-apk/www/

      - name: 6. Sincronizar e Criar Estrutura Android Nativa
        working-directory: ./morador-apk
        run: |
          npx cap add android || echo "Pasta android já existe"
          npx cap sync android

      - name: 6.5. Copiar Recursos Nativos (Sons)
        working-directory: ./morador-apk
        run: |
          # Copia Sons de Chamada para a Pasta Nativa do Android (res/raw)
          mkdir -p android/app/src/main/res/raw
          cp -r www/sound/*.mp3 android/app/src/main/res/raw/ 2>/dev/null || echo "Nenhum som para copiar ou pasta ausente"

      - name: 7. Compilar o APK Nativo
        working-directory: ./morador-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Disponibilizar Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtyMorador-v2.0.2-APK
          path: morador-apk/android/app/build/outputs/apk/debug/app-debug.apk
