name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependências do Capacitor
        working-directory: ./morador-apk
        run: |
          npm install

      - name: 5. Copiar Aplicação Web para o APK
        run: |
          mkdir -p morador-apk/www
          cp -r morador/* morador-apk/www/ 2>/dev/null || true

      - name: 6. Copiar Google Services para o Android Nativo
        run: |
          mkdir -p morador-apk/android/app
          cp morador-apk/google-services.json morador-apk/android/app/ 2>/dev/null || true

      - name: 7. Sincronizar Estrutura Android (Capacitor)
        working-directory: ./morador-apk
        run: |
          npx cap add android || echo "Pasta android ja existe"
          npx cap sync android

      - name: 8. Gerar APK Debug
        working-directory: ./morador-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: VirtyMorador-APK
          path: morador-apk/android/app/build/outputs/apk/debug/app-debug.apk
