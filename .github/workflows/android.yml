name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Dependências e CLI do Capacitor
        working-directory: ./morador-apk
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 5. Copiar Aplicação Web para o APK
        run: |
          mkdir -p morador-apk/www
          cp -r morador/* morador-apk/www/ 2>/dev/null || true

      - name: 6. Adicionar e Sincronizar Plataforma Android
        working-directory: ./morador-apk
        run: |
          npx cap add android || echo "Plataforma android ja existe"
          npx cap sync android

      - name: 7. Copiar Google Services para o Android Nativo
        run: |
          mkdir -p morador-apk/android/app
          cp morador-apk/google-services.json morador-apk/android/app/ 2>/dev/null || true

      - name: 8. Gerar APK Debug
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erro: gradlew nao encontrado no projeto!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: VirtyMorador-APK
          path: "**/app-debug.apk"
