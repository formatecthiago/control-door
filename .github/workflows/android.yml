name: Reset Full - Build APK Capacitor 2026

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Código Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (Ambiente Estável)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java 21 (Exigência do Android Moderno)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Configurar Android SDK Oficial
        uses: android-actions/setup-android@v3

      - name: 5. Instalar Dependências e Plugin Push FCM
        working-directory: ./morador-apk
        run: |
          npm install
          npm install @capacitor/push-notifications

      - name: 5.5. Transferir Web Assets (Ponte Automatizada)
        run: |
          mkdir -p morador-apk/www
          rm -rf morador-apk/www/*
          cp -r morador/* morador-apk/www/

      - name: 6. Sincronizar e Criar Estrutura Android Nativa
        working-directory: ./morador-apk
        run: |
          npx cap add android || echo "Pasta android já existe"
          npx cap sync android

      - name: 6.5. Injetar Permissões e Configurações Nativas (Via Node.js Seguro)
        working-directory: ./morador-apk
        run: |
          node -e '
          const fs = require("fs");
          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");

          // 1. Permissões de Câmera, Áudio, Vibração, Armazenamento e Notificações
          const permissions = `
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          `;

          manifest = manifest.replace("</manifest>", permissions + "\n</manifest>");

          // 2. Modificar Activity para evitar restarts na câmera e acender a tela em chamadas
          manifest = manifest.replace(/<activity([^>]+)>/, (match, attrs) => {
              if (attrs.includes("android:configChanges=")) {
                  attrs = attrs.replace(/android:configChanges="[^"]*"/, `android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|layoutDirection|fontScale|screenLayout|density|smallestScreenSize"`);
              } else {
                  attrs += ` android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|layoutDirection|fontScale|screenLayout|density|smallestScreenSize"`;
              }
              if (!attrs.includes("android:showWhenLocked")) attrs += ` android:showWhenLocked="true"`;
              if (!attrs.includes("android:turnScreenOn")) attrs += ` android:turnScreenOn="true"`;
              return `<activity${attrs}>`;
          });

          fs.writeFileSync(manifestPath, manifest, "utf8");
          console.log("AndroidManifest.xml ajustado com sucesso!");
          '

          # 3. Libera Navegação Nofail no config.xml
          sed -i '/<\/capabilities>/i \    <allow-navigation href="*" />' android/app/src/main/res/xml/config.xml || echo "Config nativa ajustada"

          # 4. Copia Sons de Chamada para a Pasta Nativa do Android (res/raw)
          mkdir -p android/app/src/main/res/raw
          cp www/sound/*.mp3 android/app/src/main/res/raw/ || echo "Sons copiados para o sistema nativo"

      - name: 7. Compilar o APK Nativo Puro
        working-directory: ./morador-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Disponibilizar Download do APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtyMorador-ResetFull-APK
          path: morador-apk/android/app/build/outputs/apk/debug/app-debug.apk
